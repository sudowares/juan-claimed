# HOST nginx (VPS) — reverse proxy + TLS in front of the Docker prod stack.
# This is NOT the container nginx (that one, frontend/nginx.conf, just serves static files
# inside the frontend image). This file lives on the VPS at:
#   /etc/nginx/sites-available/juan-claimed.nexflare.tech   (symlinked into sites-enabled)
#
# It proxies to the two containers, both published to localhost only by
# docker-compose.prod.yml:
#   frontend container -> 127.0.0.1:8083   (container nginx serving dist/)
#   backend  container -> 127.0.0.1:4000
#
# Apply:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name juan-claimed.nexflare.tech www.juan-claimed.nexflare.tech;

    # Frontend — prod frontend container (nginx serving static dist). No Vite HMR here,
    # so the WebSocket upgrade headers from the dev config are intentionally gone.
    location / {
        proxy_pass http://127.0.0.1:8083;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API. NO trailing slash on proxy_pass — the backend mounts its routes at
    # /api/* (see backend/src/app.ts), so the /api prefix must be preserved. A trailing
    # slash (http://127.0.0.1:4000/) would strip /api and every API call would 404.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/juan-claimed.nexflare.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/juan-claimed.nexflare.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.juan-claimed.nexflare.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = juan-claimed.nexflare.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name juan-claimed.nexflare.tech www.juan-claimed.nexflare.tech;
    return 404; # managed by Certbot
}
