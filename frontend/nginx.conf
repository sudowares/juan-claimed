server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routes (/my-benefits, deep
    # links, hard refresh) don't 404. Same job as frontend/vercel.json's rewrite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets (Vite fingerprints filenames, safe to cache forever).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
