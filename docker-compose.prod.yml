# Production stack for the VPS.
#   Run:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# This file only ever PULLS images — GitHub Actions builds them (from the *.prod
# Dockerfiles) and pushes to the self-hosted registry. No source code, no `build:`,
# no git checkout needed on the VPS for this stack at all — just this file + .env.
# NOT LIVE YET — needs the registry (10-self-hosted-docker-registry.md) and root Nginx
# proxy (01-folder-structure.md §2) actually running first.
# Differences from the dev docker-compose.yml:
#   - pulls prebuilt images (client baked in at CI build time, no tsx/vite watch)
#   - NO source bind mounts (image is the source of truth)
#   - Postgres + Prisma Studio are NOT exposed to the internet
#   - no CHOKIDAR polling, no demo-persona seeding
services:
  postgres:
    image: postgres:17-alpine
    container_name: juan-claimed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    # Bound to localhost only — the DB is reachable by the backend over the compose network
    # (host "postgres"), never from the public internet. Drop this block entirely if you
    # don't need host-side psql access.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: registry.nexflare.tech/juan-backend:latest
    container_name: juan-claimed-backend
    restart: unless-stopped
    # No published port at all — the VPS's Nginx runs in its OWN container (proxy-net),
    # not on the host, so it reaches this over the shared Docker network by container name
    # (http://juan-claimed-backend:4000), not via a host-bound port. Nothing to publish, nothing to
    # lock to localhost — there's no host-side listener to secure in the first place.
    # (Need host-side access for a one-off debug session? `docker compose exec backend sh`,
    # or a temporary `docker run -p`, rather than leaving a port open permanently.)
    networks:
      - default
      - proxy-net
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/app?schema=public
      BACKEND_PORT: 4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      EGOV_BASE_URL: ${EGOV_BASE_URL}
      EGOV_PARTNER_CODE: ${EGOV_PARTNER_CODE}
      EGOV_PARTNER_SECRET: ${EGOV_PARTNER_SECRET}
      EGOV_EVERIFY_CLIENT_ID: ${EGOV_EVERIFY_CLIENT_ID}
      EGOV_EVERIFY_CLIENT_SECRET: ${EGOV_EVERIFY_CLIENT_SECRET}
      EGOV_EVERIFY_PUBKEY: ${EGOV_EVERIFY_PUBKEY}
      EGOV_EMESSAGE_ACCESS_TOKEN: ${EGOV_EMESSAGE_ACCESS_TOKEN}
      EGOV_MESSAGE_BASE_URL: ${EGOV_MESSAGE_BASE_URL}
      EGOV_AI_ACCESS_CODE: ${EGOV_AI_ACCESS_CODE}
      EGOV_AI_CORE_BASE_URL: ${EGOV_AI_CORE_BASE_URL}
      EGOV_PAY_API_KEY: ${EGOV_PAY_API_KEY}
      EGOV_PAY_SETTLEMENT_TEMPLATE_UUID: ${EGOV_PAY_SETTLEMENT_TEMPLATE_UUID}
      EGOV_REPORT_ACCESS_TOKEN: ${EGOV_REPORT_ACCESS_TOKEN}
      EGOV_FACE_LIVENESS_API_KEY: ${EGOV_FACE_LIVENESS_API_KEY}
      EGOV_COMPASS_API_KEY: ${EGOV_COMPASS_API_KEY}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Vite bakes VITE_* vars into the static bundle at BUILD time, not runtime — they're
    # supplied as --build-arg in the GitHub Actions build step (.github/workflows/deploy.yml),
    # not here. Changing one of those values means rebuilding+pushing the image, not editing
    # this file.
    image: registry.nexflare.tech/juan-frontend:latest
    container_name: juan-claimed-frontend
    restart: unless-stopped
    # No published port — same reasoning as backend above. The proxy container reaches this
    # over proxy-net at http://juan-claimed-frontend:80 (container nginx serves the static dist there).
    networks:
      - proxy-net
    depends_on:
      - backend

networks:
  default:
  proxy-net:
    external: true

volumes:
  postgres_data:
